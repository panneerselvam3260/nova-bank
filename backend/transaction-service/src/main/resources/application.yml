server:
  port: ${PORT:8083}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bank_transaction}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bankpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
bank:
  services:
    account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
  security:
    jwt-secret: ${JWT_SECRET:change-me-please-32-character-secret-123456}
    jwt-expiration-seconds: ${JWT_EXPIRATION:3600}
