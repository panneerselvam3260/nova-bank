apiVersion: apps/v1
kind: Deployment
metadata: {name: transaction-service, namespace: nova-bank}
spec:
  replicas: 2
  selector: {matchLabels: {app: transaction-service}}
  template:
    metadata: {labels: {app: transaction-service}}
    spec:
      containers:
        - name: transaction-service
          image: YOUR_AWS_ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/nova-bank-transaction:latest
          ports: [{containerPort: 8083}]
          env:
            - {name: DB_HOST, value: mysql}
            - {name: DB_NAME, value: bank_transaction}
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: DB_USER}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: DB_PASSWORD}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: JWT_SECRET}}}
            - {name: ACCOUNT_SERVICE_URL, value: http://account-service:8082}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8083}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8083}, initialDelaySeconds: 30, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: transaction-service, namespace: nova-bank}
spec:
  selector: {app: transaction-service}
  ports: [{port: 8083, targetPort: 8083}]
