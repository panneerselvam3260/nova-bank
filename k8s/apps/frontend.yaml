apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: nova-bank}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: YOUR_AWS_ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/nova-bank-frontend:latest
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: nova-bank}
spec:
  selector: {app: frontend}
  type: LoadBalancer
  ports: [{port: 80, targetPort: 80}]
