apiVersion: apps/v1
kind: Deployment
metadata: {name: account-service, namespace: nova-bank}
spec:
  replicas: 2
  selector: {matchLabels: {app: account-service}}
  template:
    metadata: {labels: {app: account-service}}
    spec:
      containers:
        - name: account-service
          image: YOUR_AWS_ACCOUNT.dkr.ecr.ap-south-1.amazonaws.com/nova-bank-account:latest
          ports: [{containerPort: 8082}]
          env:
            - {name: DB_HOST, value: mysql}
            - {name: DB_NAME, value: bank_account}
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: DB_USER}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: DB_PASSWORD}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: JWT_SECRET}}}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8082}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8082}, initialDelaySeconds: 30, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: account-service, namespace: nova-bank}
spec:
  selector: {app: account-service}
  ports: [{port: 8082, targetPort: 8082}]
