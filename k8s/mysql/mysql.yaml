apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: nova-bank
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: nova-bank
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{containerPort: 3306}]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_USER
              valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: DB_USER}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: nova-bank-secrets, key: DB_PASSWORD}}
          volumeMounts:
            - {name: mysql-storage, mountPath: /var/lib/mysql}
            - {name: mysql-init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec:
              command: ["sh","-c","mysqladmin ping -h 127.0.0.1 -ubank -p$MYSQL_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: mysql-storage
          persistentVolumeClaim: {claimName: mysql-pvc}
        - name: mysql-init
          configMap: {name: mysql-init}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: nova-bank
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
