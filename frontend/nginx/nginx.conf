server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://auth-service:8081/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/accounts/ {
        proxy_pass http://account-service:8082/api/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/transactions/ {
        proxy_pass http://transaction-service:8083/api/transactions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/auth { proxy_pass http://auth-service:8081/api/auth; }
    location /api/accounts { proxy_pass http://account-service:8082/api/accounts; }
    location /api/transactions { proxy_pass http://transaction-service:8083/api/transactions; }

    location / {
        try_files $uri /index.html;
    }
}
